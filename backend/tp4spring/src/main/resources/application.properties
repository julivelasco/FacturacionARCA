spring.application.name=tp4spring
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=admin
spring.datasource.password=admin123

spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
server.error.include-message=always

arca.cuit=${ARCA_CUIT:00000000000}
arca.clave-privada=${ARCA_CLAVE_PRIVADA:./arca/privada_test.key}
arca.certificado=${ARCA_CERTIFICADO:./arca/certificado_test.crt}
arca.ticket=${ARCA_TICKET:./arca/ticket_acceso.txt}
arca.url-wsaa=https://wsaahomo.afip.gov.ar/ws/services/LoginCms
arca.url-wsfe=https://wswhomo.afip.gov.ar/wsfev1/service.asmx